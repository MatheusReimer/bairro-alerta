<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bairro Alerta - Protótipo de telas</title>
<style>
  :root {
    --azul: #2E74B5;
    --azul-esc: #1F4E79;
    --azul-claro: #DEEAF6;
    --texto: #1d2733;
    --texto-2: #5b6776;
    --borda: #e3e8ee;
    --fundo: #f4f6f9;
    --verde: #2e8b57;
    --amarelo: #c98a00;
    --vermelho: #c0392b;
    --cinza: #8a96a3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #e9edf2;
    color: var(--texto);
    min-height: 100vh;
  }
  button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }

  /* ---------- palco ---------- */
  .palco { display: flex; flex-direction: column; align-items: center; padding: 28px 16px 40px; gap: 18px; }
  .barra { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .barra button {
    padding: 6px 12px; border-radius: 999px; background: #fff; border: 1px solid var(--borda);
    font-size: 13px; color: var(--texto-2);
  }
  .barra button.ativo { background: var(--azul); border-color: var(--azul); color: #fff; }
  .grade { display: none; flex-wrap: wrap; gap: 28px; justify-content: center; }
  .grade .rotulo { text-align: center; font-size: 14px; font-weight: 600; color: var(--azul-esc); margin-top: 10px; }
  body.todas .grade { display: flex; }
  body.todas .unico { display: none; }
  body.todas .barra { display: none; }

  /* ---------- aparelho ---------- */
  .aparelho {
    width: 360px; height: 740px; background: #111; border-radius: 44px; padding: 12px;
    box-shadow: 0 18px 40px rgba(20, 40, 70, .25);
  }
  .tela {
    position: relative; width: 100%; height: 100%; background: var(--fundo);
    border-radius: 34px; overflow: hidden; display: flex; flex-direction: column;
  }
  .status {
    height: 34px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; font-size: 12px; font-weight: 600; flex: none;
  }
  .conteudo { flex: 1; overflow-y: auto; scrollbar-width: none; }
  .conteudo::-webkit-scrollbar { display: none; }

  .topo { background: #fff; padding: 6px 18px 12px; border-bottom: 1px solid var(--borda); flex: none; }
  .topo .linha { display: flex; align-items: center; gap: 10px; }
  .topo h1 { font-size: 19px; }
  .topo .sub { font-size: 12.5px; color: var(--texto-2); margin-top: 2px; }
  .voltar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--fundo); }

  .ico { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- componentes ---------- */
  .botao {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    height: 48px; border-radius: 14px; background: var(--azul); color: #fff; font-weight: 600; font-size: 15px;
  }
  .botao.sec { background: #fff; color: var(--azul); border: 1.5px solid var(--azul); }
  .botao.discreto { background: transparent; color: var(--texto-2); height: 40px; font-weight: 500; }
  .campo { display: block; margin-bottom: 14px; }
  .campo span { display: block; font-size: 12.5px; color: var(--texto-2); margin-bottom: 6px; font-weight: 600; }
  .campo .entrada {
    height: 46px; border-radius: 12px; background: #fff; border: 1px solid var(--borda);
    display: flex; align-items: center; padding: 0 14px; font-size: 14.5px; color: var(--texto);
  }
  .campo .entrada.vazio { color: var(--cinza); }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 12px 18px 4px; }
  .chip {
    flex: none; padding: 7px 12px; border-radius: 999px; background: #fff; border: 1px solid var(--borda);
    font-size: 12.5px; color: var(--texto-2);
  }
  .chip.ativo { background: var(--azul); color: #fff; border-color: var(--azul); }
  .selo { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 999px; }
  .selo::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .s-aberta { color: var(--vermelho); background: #fbeceb; }
  .s-encaminhada { color: var(--amarelo); background: #fdf3dc; }
  .s-resolvida { color: var(--verde); background: #e3f3ea; }

  .cartao {
    background: #fff; border-radius: 16px; padding: 12px; display: flex; gap: 12px;
    border: 1px solid var(--borda); text-align: left; width: 100%;
  }
  .miniatura { width: 64px; height: 64px; border-radius: 12px; flex: none; }
  .cartao h3 { font-size: 14px; line-height: 1.25; }
  .cartao .rua { font-size: 12px; color: var(--texto-2); margin: 3px 0 6px; }
  .cartao .rodape { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .apoios { font-size: 11.5px; color: var(--texto-2); display: inline-flex; align-items: center; gap: 4px; }
  .apoios .ico { width: 14px; height: 14px; }
  .lista { display: flex; flex-direction: column; gap: 10px; padding: 10px 18px 96px; }

  /* "fotos" ilustrativas */
  .f-buraco { background: linear-gradient(160deg, #6b6f75 0%, #4a4e54 55%, #2f3236 56%, #3a3d41 70%, #5c6066 71%); }
  .f-luz { background: radial-gradient(circle at 70% 30%, #3b4a63 0 10%, transparent 11%), linear-gradient(180deg, #1c2638, #2c3a52); }
  .f-entulho { background: linear-gradient(135deg, #8d7b62 0 25%, #b9ab92 25% 45%, #6f6250 45% 60%, #cfc4ad 60% 75%, #7d6f5a 75%); }
  .f-agua { background: linear-gradient(180deg, #9fb3c4 0 40%, #6f8aa1 40% 100%); }
  .f-calcada { background: repeating-linear-gradient(90deg, #b8b2a7 0 22px, #a39d92 22px 24px); }

  .fab {
    position: absolute; right: 18px; bottom: 82px; height: 52px; padding: 0 18px; border-radius: 16px;
    background: var(--azul); color: #fff; font-weight: 600; display: flex; align-items: center; gap: 8px;
    box-shadow: 0 8px 18px rgba(46, 116, 181, .4);
  }
  .abas {
    position: absolute; left: 0; right: 0; bottom: 0; height: 68px; background: #fff; border-top: 1px solid var(--borda);
    display: flex; justify-content: space-around; align-items: center; padding-bottom: 8px;
  }
  .abas button { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--cinza); }
  .abas button.ativo { color: var(--azul); font-weight: 600; }

  .alternar { display: flex; background: var(--fundo); border-radius: 10px; padding: 3px; margin-top: 10px; }
  .alternar button { flex: 1; height: 32px; border-radius: 8px; font-size: 13px; color: var(--texto-2); }
  .alternar button.ativo { background: #fff; color: var(--texto); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }

  /* mapa ilustrativo */
  .mapa { position: relative; background: #e8ece4; overflow: hidden; }
  .mapa .rua-h, .mapa .rua-v { position: absolute; background: #fff; }
  .mapa .rua-h { left: -10%; right: -10%; height: 14px; }
  .mapa .rua-v { top: -10%; bottom: -10%; width: 14px; }
  .mapa .quadra { position: absolute; background: #dfe5da; border-radius: 4px; }
  .pino { position: absolute; transform: translate(-50%, -100%); }
  .pino .gota {
    width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    display: grid; place-items: center; box-shadow: 0 3px 6px rgba(0,0,0,.25); border: 2px solid #fff;
  }
  .pino .gota span { transform: rotate(45deg); color: #fff; font-size: 12px; font-weight: 700; }
  .eu { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: var(--azul); border: 3px solid #fff; box-shadow: 0 0 0 8px rgba(46,116,181,.2); transform: translate(-50%, -50%); }

  .secao { padding: 14px 18px 0; }
  .secao h2 { font-size: 13px; color: var(--texto-2); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
  .foto-grande { height: 170px; border-radius: 16px; position: relative; overflow: hidden; }
  .foto-grande .acao {
    position: absolute; right: 10px; bottom: 10px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px;
    padding: 6px 10px; border-radius: 999px; display: flex; align-items: center; gap: 5px;
  }
  .categorias { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .cat {
    background: #fff; border: 1.5px solid var(--borda); border-radius: 14px; padding: 10px 4px; font-size: 12px;
    display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--texto-2);
  }
  .cat.ativo { border-color: var(--azul); background: var(--azul-claro); color: var(--azul-esc); font-weight: 600; }
  .local { background: #fff; border: 1px solid var(--borda); border-radius: 14px; overflow: hidden; }
  .local .info { padding: 10px 12px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .local .info small { display: block; color: var(--texto-2); font-size: 11.5px; }
  .aviso { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: var(--texto-2); padding: 12px 18px 0; }
  .aviso .ico { width: 16px; height: 16px; flex: none; margin-top: 1px; }

  .veu { position: absolute; inset: 0; background: rgba(15, 25, 40, .45); }
  .folha {
    position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 24px 24px 0 0; padding: 10px 18px 26px;
  }
  .folha .puxador { width: 40px; height: 5px; border-radius: 3px; background: var(--borda); margin: 0 auto 14px; }
  .folha h2 { font-size: 18px; margin-bottom: 4px; }
  .folha p { font-size: 13.5px; color: var(--texto-2); margin-bottom: 14px; line-height: 1.4; }

  .linha-tempo { list-style: none; padding: 4px 0 0; }
  .linha-tempo li { position: relative; padding: 0 0 16px 28px; font-size: 13.5px; }
  .linha-tempo li::before {
    content: ""; position: absolute; left: 5px; top: 3px; width: 12px; height: 12px; border-radius: 50%;
    background: #fff; border: 2.5px solid var(--borda);
  }
  .linha-tempo li::after { content: ""; position: absolute; left: 10px; top: 17px; bottom: 0; width: 2px; background: var(--borda); }
  .linha-tempo li:last-child::after { display: none; }
  .linha-tempo li.feito::before { background: var(--azul); border-color: var(--azul); }
  .linha-tempo li.feito::after { background: var(--azul); }
  .linha-tempo small { display: block; color: var(--texto-2); font-size: 12px; margin-top: 2px; }

  .contador { display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid var(--borda); border-radius: 14px; padding: 12px 14px; }
  .contador strong { font-size: 22px; color: var(--azul); }
  .contador span { font-size: 12.5px; color: var(--texto-2); }

  .mod-cartao { background: #fff; border: 1px solid var(--borda); border-radius: 16px; padding: 12px; }
  .mod-cartao .topo-c { display: flex; gap: 10px; }
  .mod-cartao .acoes { display: flex; gap: 6px; margin-top: 10px; }
  .mod-cartao .acoes button { flex: 1; height: 34px; border-radius: 10px; font-size: 12px; font-weight: 600; border: 1px solid var(--borda); background: var(--fundo); color: var(--texto-2); }
  .mod-cartao .acoes .enc { background: #fdf3dc; color: var(--amarelo); border-color: #f5e2b0; }
  .mod-cartao .acoes .res { background: #e3f3ea; color: var(--verde); border-color: #c6e6d3; }
  .mod-cartao .acoes .ocu { background: #fbeceb; color: var(--vermelho); border-color: #f2cfcb; }
  .denuncia { font-size: 11.5px; color: var(--vermelho); margin-top: 6px; }
</style>
</head>

<div class="palco">
  <nav class="barra" id="barra"></nav>
  <div class="unico"><div class="aparelho"><div class="tela" id="tela"></div></div></div>
  <div class="grade" id="grade"></div>
</div>

<template id="t-entrar">
  <div class="status"><span>9:41</span><span>●●● ▮</span></div>
  <div class="conteudo" style="padding: 40px 26px 20px; display:flex; flex-direction:column;">
    <div style="width:64px;height:64px;border-radius:18px;background:var(--azul);display:grid;place-items:center;color:#fff;margin-bottom:18px">
      <svg class="ico" style="width:34px;height:34px"><use href="#i-pino"/></svg>
    </div>
    <h1 style="font-size:28px;color:var(--azul-esc)">Bairro Alerta</h1>
    <p style="color:var(--texto-2);font-size:14.5px;margin:6px 0 32px;line-height:1.4">Registre e acompanhe os problemas do seu bairro.</p>
    <label class="campo"><span>E-mail</span><div class="entrada">ana.souza@email.com</div></label>

</template>

    <button><svg class="ico"><use href="#i-pessoa"/></svg>Perfil</button>

<template id="t-nova">
  <div class="status"><span>9:41</span><span>●●● ▮</span></div>
  <div class="topo"><div class="linha"><button class="voltar" data-ir="inicio"><svg class="ico"><use href="#i-voltar"/></svg></button><h1>Nova ocorrência</h1></div></div>

      </div>

          <div style="flex:1"><h3 style="font-size:14px">Registro sem relação com o bairro</h3><div class="rua" style="font-size:12px;color:var(--texto-2);margin-top:3px">Rua Gustav Salinger · 0 apoios</div>
            <div class="denuncia">Denunciado por 3 moradores</div></div></div>

      </div>

<script>
  const TELAS = [
    ["entrar", "1. Entrar"],
    ["inicio", "2. Início (lista e mapa)"],
    ["nova", "3. Nova ocorrência"],
    ["duplicado", "4. Registro parecido"],
    ["detalhe", "5. Acompanhamento"],
    ["moderacao", "6. Moderação"],
  ];
  const tela = document.getElementById("tela");
  const barra = document.getElementById("barra");

  function ligar(raiz) {
    raiz.querySelectorAll("[data-ir]").forEach(el => el.addEventListener("click", e => {
      e.stopPropagation();
      mostrar(el.dataset.ir);
    }));
    raiz.querySelectorAll("[data-modo]").forEach(el => el.addEventListener("click", () => {
      const mapa = el.dataset.modo === "mapa";
      raiz.querySelector(".vista-lista").style.display = mapa ? "none" : "";
      raiz.querySelector(".vista-mapa").style.display = mapa ? "" : "none";
      raiz.querySelectorAll("[data-modo]").forEach(b => b.classList.toggle("ativo", b === el));
    }));
  }

  function mostrar(id) {
    tela.replaceChildren(document.getElementById("t-" + id).content.cloneNode(true));
    ligar(tela);
    barra.querySelectorAll("button").forEach(b => b.classList.toggle("ativo", b.dataset.id === id));
    history.replaceState(null, "", "#" + id);
  }

  TELAS.forEach(([id, nome]) => {
    const b = document.createElement("button");
    b.textContent = nome;
    b.dataset.id = id;
    b.addEventListener("click", () => mostrar(id));
    barra.append(b);
  });

  // ?todas mostra as seis telas lado a lado (usado para a figura do relatório)
  if (new URLSearchParams(location.search).has("todas")) {
    document.body.classList.add("todas");
    const grade = document.getElementById("grade");
    TELAS.forEach(([id, nome]) => {
      const bloco = document.createElement("div");
      bloco.innerHTML = '<div class="aparelho"><div class="tela"></div></div><div class="rotulo"></div>';
      bloco.querySelector(".tela").append(document.getElementById("t-" + id).content.cloneNode(true));
      bloco.querySelector(".rotulo").textContent = nome;
      grade.append(bloco);
    });
  }

  const inicial = location.hash.slice(1);
  mostrar(TELAS.some(([id]) => id === inicial) ? inicial : "entrar");
</script>
